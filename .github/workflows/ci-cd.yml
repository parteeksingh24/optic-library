# Workflow name
name: Optic Library CI/CD

# Trigger events for the workflow
on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

# Jobs to be executed
jobs:
  check_source_files:
    runs-on: ubuntu-latest
    outputs:
      has_source_files: ${{ steps.check_files.outputs.has_source_files }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for source files
        id: check_files
        run: |
          if find . -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | grep -q .; then
            echo "has_source_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_source_files=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_source_files
    if: needs.check_source_files.outputs.has_source_files == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      # If one job fails, continue running others to gather feedback from all jobs
      fail-fast: false

      # Matrix to define multiple combinations of OS, build types, and compilers
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]  # Compilers used in the matrix
        include:
          # Windows using MSVC (cl)
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          # Linux using GCC
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          # Linux using Clang
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          # macOS using Clang (default)
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          # Exclude invalid or redundant combinations
          - os: windows-latest
            c_compiler: gcc  # GCC is not valid on Windows
          - os: windows-latest
            c_compiler: clang  # Clang is also not valid on Windows
          - os: ubuntu-latest
            c_compiler: cl  # MSVC (cl) is not valid on Linux
          - os: macos-latest
            c_compiler: gcc # GCC is not the default on macOS
          - os: macos-latest
            c_compiler: cl # MSVC (cl) is not valid on macOS

    steps:
    - uses: actions/checkout@v4  # Checkout the code from the repository

    - name: Set reusable strings
      # Create reusable variables (like the build output directory) to avoid repeating them in different steps
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      # Install CMake, compilers, and Ninja for optimized builds
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ clang ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      # Install CMake and Ninja on macOS using Homebrew
      run: |
        brew install cmake ninja

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      # Install CMake, Ninja, and Visual Studio Build Tools on Windows  
      run: |
        choco install cmake ninja
        choco install visualstudio2022buildtools

    - name: Configure CMake
      # Configure the build using CMake with Ninja generator for optimal performance
      # Using matrix variables to set the compilers and build type for each job
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        -DBUILD_BENCHMARKS=ON
        -S ${{ github.workspace }}

    - name: Build
      # Build the project using the CMake configuration
      # Use the matrix's build type (Release by default)
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      # Run tests using CTest in the build output directory
      # For multi-config generators (like Visual Studio), specify the build config (Release/Debug)
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # Static analysis job using Clang-Tidy and Clang-Format
  static-analysis:
    needs: check_source_files
    if: needs.check_source_files.outputs.has_source_files == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Checkout the repository code

      - name: Install Clang-Tidy and Clang-Format
        # Install Clang-Tidy and Clang-Format on Ubuntu for static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format

      - name: Run Clang-Tidy
        # Run Clang-Tidy for static analysis on all .cpp, .hpp, and .h files
        run: |
          find . -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | xargs -I {} clang-tidy {} -- -std=c++23

      - name: Run Clang-Format
        # Check code formatting using Clang-Format and ensure no changes are needed
        run: |
          find . -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | xargs clang-format -i --dry-run --Werror

  # Coverage analysis job
  coverage:
    needs: check_source_files
    if: needs.check_source_files.outputs.has_source_files == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ ninja-build lcov

      - name: Configure CMake for Coverage
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Coverage
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build with Coverage
        run: cmake --build build

      - name: Run Tests with Coverage
        working-directory: build
        run: cmake --build . --target coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.info.cleaned
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  # Documentation generation job
  documentation:
    needs: check_source_files
    if: needs.check_source_files.outputs.has_source_files == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen graphviz

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF

      - name: Generate Documentation
        run: cmake --build build --target doc_doxygen

      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/api

  # Sanitizer testing jobs
  sanitizer-tests:
    needs: check_source_files
    if: needs.check_source_files.outputs.has_source_files == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ ninja-build

      - name: Configure CMake with ${{ matrix.sanitizer }} sanitizer
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_SANITIZER_$(echo ${{ matrix.sanitizer }} | tr '[:lower:]' '[:upper:]')=ON
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build with sanitizer
        run: cmake --build build

      - name: Run tests with sanitizer
        working-directory: build
        run: ctest --output-on-failure

  # Pre-commit verification job
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # Job to notify if no source files are found
  no_source_files:
    needs: check_source_files
    if: needs.check_source_files.outputs.has_source_files == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Notify no source files
        run: |
          echo "No source files found in the repository."
          echo "Please add some source files before running the CI pipeline."
